name: Build & release desktop app
# Mỗi lần push: chỉ build bản THỬ NGHIỆM (Windows), ghi đè vào một pre-release duy nhất tên "test" – không tạo Release mới.
# Release chính thức: Actions → "Build & release desktop app" → Run workflow → chọn release = true (sau khi đã test xong).
on:
  push:
    branches: [main, 'claude/**']
    paths: [package.json, CHANGELOG.md, '.github/workflows/build-desktop.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Phát hành Release chính thức (Windows + Mac + Linux) cho version hiện tại'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  test:
    if: github.event_name == 'push' || !inputs.release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist:win -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Ghi đè pre-release "test"
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="$(node -p "require('./package.json').version")"
          gh release delete test --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          awk -v t="## $V" '$0 ~ "^## " {p = index($0, t) == 1} p' CHANGELOG.md > notes.md
          gh release create test dist/*.exe --prerelease --target "$GITHUB_SHA" --title "AccSoft $V – bản thử nghiệm (chưa phát hành)" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run ${{ matrix.cmd }} -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: AccSoft-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
  release:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.exists == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Release notes from CHANGELOG
        run: awk -v t="## ${{ needs.check.outputs.tag }}" '$0 ~ "^## " {p = index($0, t) == 1} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AccSoft ${{ needs.check.outputs.tag }}
          body_path: notes.md
          files: out/*
      - name: Xoá Release cũ, giữ 5 bản chính thức mới nhất (giữ tag git, không đụng bản "test")
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-pre-releases --exclude-drafts --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' | grep -vx test | while read -r t; do
            echo "Xoá release $t"; gh release delete "$t" --yes --repo "$GITHUB_REPOSITORY" || true; done
